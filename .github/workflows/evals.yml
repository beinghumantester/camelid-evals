name: camelid-evals

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  unit-tests:
    name: evaluator unit tests (scripts/lib/*.ts — no live/mock Camelid or API key needed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      # A broken grader should fail fast and separately from a broken Camelid behavior — the
      # same "don't let a broken evaluator masquerade as a Camelid failure" principle behind
      # the ERROR status, applied to CI structure instead of a single run's report.
      - name: Run evaluator unit tests
        run: npm test

  automated:
    name: environment-integrity + self-conformance + regression-museum (mock server, no API key needed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Start mock Camelid server (default BUG_MODE=stop_straddle — matches the pinned, unfixed v0.6.1/v0.7.0 laptop, see docs/V0.6.1_DRIFT_AUDIT.md)
        run: |
          nohup npx tsx mock-server/server.ts > mock-server.log 2>&1 &
          echo $! > mock-server.pid
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8181/api/capabilities > /dev/null && exit 0
            sleep 0.5
          done
          echo "mock server never became healthy"; cat mock-server.log; exit 1
        env:
          CAMELID_BASE_URL: http://127.0.0.1:8181

      - name: Run environment-integrity + self-conformance + regression-museum evals (expect KB-1=KNOWN_DEFECT, KB-2=NOT_APPLICABLE, run succeeds)
        run: npx tsx scripts/run-harness.ts --domain environment-integrity,self-conformance,regression-museum
        env:
          CAMELID_BASE_URL: http://127.0.0.1:8181

      - name: Prove tier isolation (KB-1 must FAIL if the mock stops reproducing the bug while the harness still believes it's on an unfixed version)
        # Runs a SECOND mock server on a different port (8182) rather than killing and
        # restarting on 8181. `nohup npx tsx ... &` backgrounds the outer `tsx` wrapper
        # process, but tsx spawns a separate child Node process that's the one actually
        # holding the listening socket — `kill "$(cat mock-server.pid)"` only kills the
        # wrapper (confirmed via `ps -o pid,ppid`: the child's PPID is the wrapper, and it is
        # NOT killed when the wrapper is), so the orphaned child keeps serving BUG_MODE=stop_straddle
        # forever. The old attempt to kill-and-restart on the same port then either raced an
        # EADDRINUSE (the new process dies immediately, silently, in the background) or, once
        # that was fixed, just kept talking to the immortal orphan — reproducing the exact
        # "expected FAIL but the run passed" CI failure. Two independent ports sidestep the
        # whole class of problem instead of trying to out-wait it.
        run: |
          BUG_MODE=fixed MOCK_PORT=8182 nohup npx tsx mock-server/server.ts > mock-server-bug.log 2>&1 &
          echo $! > mock-server-bug.pid
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8182/api/capabilities > /dev/null && break
            sleep 0.5
          done
          grep -q "BUG_MODE=fixed" mock-server-bug.log || {
            echo "mock-server-bug.log never confirmed BUG_MODE=fixed — the second server never came up healthy"
            cat mock-server-bug.log
            exit 1
          }

          if CAMELID_BASE_URL=http://127.0.0.1:8182 npm run evals:automated; then
            echo "expected regression-museum#1 (KB-1, characterization) to FAIL when BUG_MODE=fixed but the running version still predates the real fix, but the run passed"
            exit 1
          else
            echo "confirmed: KB-1 correctly failed — the historically-known defect stopped reproducing on a version that should still have it"
          fi

      - name: Stop mock servers
        if: always()
        run: |
          kill "$(cat mock-server.pid)" 2>/dev/null || true
          kill "$(cat mock-server-bug.pid)" 2>/dev/null || true
          # Best-effort: also reap tsx's orphaned child node process on each port (see the
          # comment above) — harmless if it fails, the runner VM is destroyed right after anyway.
          fuser -k 8181/tcp 2>/dev/null || true
          fuser -k 8182/tcp 2>/dev/null || true
          true

      - name: Upload run reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: runs/*.json
          if-no-files-found: ignore

  semantic:
    name: evidence-audit + model-compatibility (needs ANTHROPIC_API_KEY)
    runs-on: ubuntu-latest
    # Semantic (LLM-judged) domains only run when the secret is configured.
    # Forked PRs never have access to repo secrets, so this job skips
    # gracefully there rather than failing — this mirrors run-harness.ts's
    # own graceful-SKIPPED behavior when ANTHROPIC_API_KEY is unset locally.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Start mock Camelid server
        run: |
          nohup npx tsx mock-server/server.ts > mock-server.log 2>&1 &
          echo $! > mock-server.pid
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8181/api/capabilities > /dev/null && exit 0
            sleep 0.5
          done
          echo "mock server never became healthy"; cat mock-server.log; exit 1
        env:
          CAMELID_BASE_URL: http://127.0.0.1:8181

      - name: Run evidence-audit + model-compatibility evals
        run: npm run evals:semantic
        env:
          CAMELID_BASE_URL: http://127.0.0.1:8181
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Stop mock server
        if: always()
        run: kill "$(cat mock-server.pid)" 2>/dev/null || true

      - name: Upload run reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports-semantic
          path: runs/*.json
          if-no-files-found: ignore
